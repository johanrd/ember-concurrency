---
name: CI

on:
  push:
    branches:
      - master
      - v1
      - v2
      # npm version tags
      - /^v\d+.\d+.\d+(?:-(?:alpha|beta|rc)\.\d+)?/
  pull_request:
  schedule:
    - cron: '0 4 * * 6' # Saturdays at 4am

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: wyvox/action@v1
      with:
        pnpm-args: --frozen-lockfile

    - name: Lint
      run: pnpm lint

  transform-babel:
    name: Transform - Babel ${{ matrix.babel }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        babel: ['7', '8']

    steps:
    - uses: wyvox/action@v1
      with:
        pnpm-args: --frozen-lockfile

    # --ignore-scripts skips the package's `prepare` build, which runs the addon's
    # own Babel 7 toolchain (@babel/plugin-transform-typescript) and would fail
    # under Babel 8. The smoke test loads the transform source directly, not dist.
    - name: Override @babel/core
      run: pnpm --filter ember-concurrency add -D @babel/core@${{ matrix.babel }} --ignore-scripts

    - name: Run async-arrow transform smoke test
      env:
        EXPECT_BABEL_MAJOR: ${{ matrix.babel }}
      run: pnpm --filter ember-concurrency test:transform

  # The addon test suite, on the Vite/Embroider app. ember-source publishes
  # lts/latest/beta/alpha dist-tags, so the version axis needs no ember-try.
  #
  # ember-source only became a v2 addon in 6.1. Older releases build through
  # Embroider's classic compat pipeline instead, which `compat: true` turns on
  # (ENABLE_COMPAT_BUILD -> classicEmberSupport + ember-cli-build.js). Embroider
  # supports Ember 3.28.11+, so one app covers the whole supported range.
  #
  # `with` pins deps that have to move in step with old Ember: @glimmer/component
  # 2 imports @ember/owner, which does not exist in 4.8.
  addon-tests:
    name: Addon - Ember ${{ matrix.ember }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure || false }}
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - ember: '~4.8.0'
            compat: true
            with: '@glimmer/component@^1.1.2'
          - ember: '~4.12.0'
            compat: true
          - ember: '~5.0.0'
            compat: true
          - ember: '~6.4.0'
          - ember: lts
          - ember: latest
          - ember: beta
            allow-failure: true
          - ember: alpha
            allow-failure: true

    steps:
    - uses: wyvox/action@v1
      with:
        pnpm-args: --frozen-lockfile

    - name: Override ember-source
      run: pnpm --filter tests add -D ember-source@${{ matrix.ember }} ${{ matrix.with }} --ignore-scripts

    - name: Test
      env:
        ENABLE_COMPAT_BUILD: ${{ matrix.compat }}
      run: pnpm --filter tests test

  test:
    name: Docs app
    runs-on: ${{ matrix.os }}
    needs: lint

    strategy:
      matrix:
        os: [ubuntu-latest]
        browser: [chrome, firefox]

    steps:
    - uses: wyvox/action@v1
      with:
        pnpm-args: --frozen-lockfile

    - name: Test
      run: pnpm test:ember --launch ${{ matrix.browser }}

  floating-dependencies:
    name: Floating Dependencies
    runs-on: ${{ matrix.os }}
    needs: lint

    strategy:
      matrix:
        os: [ubuntu-latest]
        browser: [chrome, firefox]

    steps:
    - uses: wyvox/action@v1
      with:
        pnpm-args: --frozen-lockfile

    - name: Test
      run: pnpm test:ember --launch ${{ matrix.browser }}

  try-scenarios:
    name: Tests - ${{ matrix.ember-try-scenario }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure }}
    needs: test
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        ember-try-scenario:
        - ember-lts-4.8
        - ember-lts-4.12
        - ember-5.0
        - ember-lts-6.4
        - ember-default
        - ember-default-with-coverage
        - tsc
        - embroider-safe
        - embroider-optimized
        allow-failure: [false]

    steps:
    - uses: wyvox/action@v1
      with:
        pnpm-args: --frozen-lockfile

    - name: Test
      env:
        EMBER_TRY_SCENARIO: ${{ matrix.ember-try-scenario }}
      run: pnpm --filter test-app test:ember-try $EMBER_TRY_SCENARIO
